<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ponto Certo</title>
  <link rel="stylesheet" href="/public/css/navbar/navbar.css">
  <link rel="stylesheet" href="/public/css/carrinho.css">
</head>

<body>
  <header>
    <nav class="navbar">

      <a class="logo" href="/index.html">
        <img src="/public/images/logo_ponto.svg" alt="Logo Ponto Certo">
      </a>

      <ul class="nav-list">
        <li><a href="/index.html"> Página Inicial </a></li>
        <li><a href="/historico.html"> Meus Pedidos</a></li>
      </ul>

      <ul class="nav_icones">
        <li><a href="/carrinho.html"> <img src="/public/images/shopping-cart.svg" alt="carrinho"></a></li>
        <li><a href="/configuracoes.html"> <img src="/public/images/settings.svg" alt="configuracao"></a></li>

      </ul>
    </nav>
  </header>

  <div class="cabecalho-pagina">
    <a class="botao-voltar" id="botao-voltar"><img class="img-voltar" src="/public/images/voltar.svg" alt="voltar"></a>
  </div>

  <main class="carrinho">

    <div class="coluna-tabela">
      <div class="tabela-container">
        <table class="tabela-carrinho">
          <thead>
            <tr>
              <th>Produto</th>
              <th>Preço</th>
              <th>Quantidade</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody>

            

          </tbody>
        </table>
      </div>
    </div>
    <form action="pagamento/tela_pagamento.html">
      <div class="coluna-resumo">
        <div class="resumo-compra">

          <div class="cabecalho-resumo">
            <span class="titulo-resumo">Resumo da Compra</span>
          </div>

          <div class="linha-resumo">
            <span>SUBTOTAL</span>
            <span class="valor-subtotal">R$0,00</span>
          </div>

          <div class="linha-resumo">
            <span>FRETE</span>
            <span class="valor-frete">---</span>
          </div>

          <div class="linha-resumo">
            <span>TOTAL</span>
            <span class="valor-total">R$0,00</span>
          </div>

          <button class="botao-continuar">Continuar</button>
        </div>

        <div class="frete-card">
          <span class="titulo-frete">Consultar Frete</span>
          <div class="campos-frete">
            <input type="text" placeholder="Insira o CEP" class="input-cep" />
            <button type="button" class="botao-consultar-frete">Consultar o Frete</button>
          </div>
        </div>


      </div>
    </form>

  </main>
  <div id="toast" class="toast"></div>
  <script src="/public/js/carrinho.js"></script>
  <script src="/public/js/botao_voltar.js"></script>
  <script src="/public/js/modal.js"></script>
</body>

</html>
