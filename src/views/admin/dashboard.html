<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="/public/css/admin/navbar_master.css">
    <link rel="stylesheet" href="/public/css/admin/conteudo_master.css">
    <link rel="stylesheet" href="/public/css/admin/dashboard.css">

</head>

<body>
    <div class="layout-master">

        <aside class="sidebar-master">
            <div class="topo-navbar">
                <img src="/public/images/logo_ponto.svg" alt="logo" class="logo-sidebar">
                <img src="/public/images/linha_navbar.svg" alt="" class="linha-divisoria">
            </div>
            <nav class="menu">
                <ul>
                    <li><a href="/admin/dashboard.html" class="link-sidebar">Dashboard</a></li>
                    <li><a href="/admin/clientes.html" class="link-sidebar">Clientes</a></li>
                    <li><a href="/admin/pedidos.html" class="link-sidebar">Pedidos</a></li>
                    <li><a href="/admin/trocas.html" class="link-sidebar">Trocas</a></li>
                </ul>
            </nav>
        </aside>


        <main class="conteudo-master">
            <div class="cabecalho-conteudo">
                <h1 class="titulo-conteudo">DASHBOARD</h1>

                <div class="area-filtros">
                    <h2 class="titulo-grafico">Análise de Vendas</h2>

                    <div class="selects-filtros">
                        <h3 class="titulo-filtro" id="inicio">De</h3>
                        <select id="mesInicio" class="mes">
                            <option class="placeholder" value="01" disabled selected hidden>Mês</option>
                            <option class="mes" value="01">Jan</option>
                            <option class="mes" value="02">Fev</option>
                            <option class="mes" value="03">Mar</option>
                            <option class="mes" value="04">Abr</option>
                            <option class="mes" value="05">Maio</option>
                            <option class="mes" value="06">Jun</option>
                            <option class="mes" value="07">Jul</option>
                            <option class="mes" value="08">Ago</option>
                            <option class="mes" value="09">Set</option>
                            <option class="mes" value="10">Out</option>
                            <option class="mes" value="11">Nov</option>
                            <option class="mes" value="12">Dez</option>
                        </select>

                        <h3 class="titulo-filtro" id="fim">Até</h3>
                        <select id="mesFim" class="mes">
                            <option class="placeholder" value="12" disabled selected hidden>Mês</option>
                            <option class="mes" value="01">Jan</option>
                            <option class="mes" value="02">Fev</option>
                            <option class="mes" value="03">Mar</option>
                            <option class="mes" value="04">Abr</option>
                            <option class="mes" value="05">Maio</option>
                            <option class="mes" value="06">Jun</option>
                            <option class="mes" value="07">Jul</option>
                            <option class="mes" value="08">Ago</option>
                            <option class="mes" value="09">Set</option>
                            <option class="mes" value="10">Out</option>
                            <option class="mes" value="11">Nov</option>
                            <option class="mes" value="12">Dez</option>
                        </select>

                        <h3 class="titulo-filtro">Ano</h3>
                        <select class="ano" id="ano">
                            <option disabled selected hidden value="2026">Ano</option>
                            <option class="ano" value="2026">2026</option>
                            <option class="ano" value="2025">2025</option>
                            <option class="ano" value="2024">2024</option>
                        </select>

                        <button type="button" class="btn-filtar" id="filtrar">Filtrar</button>
                        <button type="button" class="btn-filtar" id="exportar">Exportar para CSV</button>

                        <p id="erro" class="erro-filtro" style="color:#b00020"></p>

                    </div>
                    <div class="categorias" id="categorias">
                        <input type="checkbox" id="todas-opcoes">
                        <label for="todas-opcoes">Selecionar Tudo</label>
                        <div id="listaCategorias"></div>

                    </div>


                </div>

                <div class="chart">
                    <canvas id="myChart"></canvas>
                </div>
            </div>
        </main>
    </div>


    

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/public/js/dashboard.js"></script>
    <script src="/public/js/checkbox.js"></script>
</body>

</html>
