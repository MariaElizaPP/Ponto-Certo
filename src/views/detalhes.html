    <section class="principal">
        <div class="galeria">
            <div class="img">
                <img>
            </div>
        </div>

        <div class="informacoes-produto">
            <h3 class="nome-produto"></h3>
            <div class="info-preco">
                <div class="preco"></div>
            </div>
            <p class="texto">
            </p>

            <h5 class="texto-cor">Cor:</h5>
            <div class="seletor-cor" id="seletor-cor">
                <button type="button" class="select-variacao" id="seletor-cor-atual">
                    <img class="seletor-cor-img" src="" alt="">

            <div class="add-carrinho-container">
                <div class="contador">
                    <button class="remover">

                    </button>
                    <span class="contar">0</span>
                    <button class="adicionar">
                        <img src="/public/images/adicionar.svg">
                    </button>


                </div>
                <button class="btn-modal-abrir">Adicionar ao Carrinho</button>
                <dialog id="modal-abrir" class="modal-abrir">
                    <img class="icone-sucesso" src="public/images/sucesso-modal.svg" alt="sucesso-modal">
                    <h3>Produto adicionado ao seu carrinho</h3>
                    <span>Ação realizada com sucesso!</span>
                    <button class="btn-modal-fechar" data-modal="modal-abrir">Continuar comprando</button>
                </dialog>

            </div>
            <a href="/carrinho.html" class="link-btn-comprar"><button class="comprar">Comprar Agora</button></a>


        </div>
