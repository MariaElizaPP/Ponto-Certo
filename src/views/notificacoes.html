<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ponto Certo - Notificações</title>
  <link rel="stylesheet" href="/public/css/notificacoes.css">
</head>

<body>

  <div class="barra-topo">
    <button class="botao-voltar" type="button">
      <img src="/public/images/voltar.svg" alt="Voltar">
    </button>
    <img class="logo" src="/public/images/pontinho_cadastro.svg" alt="Logo Ponto Certo">
  </div>

  <main class="conteudo">
    <div class="pagina-form">

      <h3 class="titulo">Notificações</h3>

      <span class="titulo-dados">Recentes</span>

     
      <ul class="lista-notificacoes" id="lista-notificacoes">
        <li class="notificacao-vazia">Carregando...</li>
      </ul>

      <div class="botoes">
        <button class="cadastrar" id="btn-marcar-todas" type="button">Marcar todas como lidas</button>
      </div>

    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script src="/public/js/botao_voltar.js"></script>
  <script src="/public/js/notificacoes.js"></script>

</body>

</html>
